name: CI Runner Pipeline Auto

on:
  workflow_dispatch:
  schedule:
    # اجرای اتوماتیک هر ۵ ساعت یک‌بار
    - cron: '0 */5 * * *'

jobs:
  build-and-run:
    runs-on: windows-latest
    steps:
      - name: Environment Setup
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          Write-Output "Initializing environment..."

      - name: Configure RDP User
        run: |
          $User = "rwa"
          $Password = ConvertTo-SecureString "Pass123456789!" -AsPlainText -Force
          New-LocalUser $User -Password $Password -FullName "RDP User" -Description "RDP Admin User"
          Add-LocalGroupMember -Group "Administrators" -Member $User
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Connect Mesh Network
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ("$env:TS_KEY" -ne "") {
            echo "Installing tailscale..."
            choco install tailscale -y

            # Enable IP Routing in Registry
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'IPEnableRouter' -Value 1

            # Enable & Start RemoteAccess / Routing Service
            Set-Service -Name RemoteAccess -StartupType Automatic
            Start-Service -Name RemoteAccess -ErrorAction SilentlyContinue

            # Connect Tailscale with explicit hostname and exit-node flag
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="github-runner" --advertise-exit-node --unattended
            Start-Sleep -Seconds 10
          } else {
            echo "Tailscale key missing, skipping..."
          }

      - name: Keep Alive Loop
        run: |
          # ۲۹۰ دقیقه (۴ ساعت و ۵۰ دقیقه) برای جلوگیری از تداخل با کرون بعدی
          $timeout = 290
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            Write-Output "Session active... ($elapsed mins)"
            Start-Sleep -Seconds 60
            $elapsed++
          }
